name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  schedule:
    # Auto-release future-dated posts on their date without a local push.
    # future:false hides a post until its date; these daily rebuilds let it
    # through the morning its date arrives. Two runs = belt-and-braces vs cron lag.
    # Cron is UTC. Tuesday launch is 12:00 AEST — both runs land before it.
    - cron: '30 23 * * *'   # ~09:30 AEST / 10:30 AEDT
    - cron: '30 0 * * *'    # ~10:30 AEST / 11:30 AEDT

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
