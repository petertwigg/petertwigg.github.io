# Set theme
remote_theme: daviddarnes/alembic@main

# File excludes
exclude:
- tmp/
- vendor/
- README.md
- Gemfile
- Gemfile.lock

# Set plugins
plugins:
- jekyll-sitemap
- jekyll-mentions
- jekyll-paginate
- jekyll-seo-tag
- jekyll-redirect-from
- jekyll-default-layout
- jekyll-feed
- jemoji
- jekyll-remote-theme

# RSS feed — bumped from default 10 to 20 entries (5 May 2026, for Substack import)
feed:
  posts_limit: 20


# Site settings
url: 'https://petertwigg.com'
baseurl: ''

title: Peter Twigg Meditation | Beyond Belief, Into Knowing — a One-Year Course
description: Meditation beyond belief, into knowing — the direct, first-hand experience of the Self, taught by Peter Twigg (forty years' practice, thirty years teaching). Join the School of Knowing one-year course in consciousness and spiritual meditation.

# Site-level image key (kept for reference / other plugins).
# ⚠️ NOTE (23 Jun 2026): jekyll-seo-tag does NOT use this top-level `image:` for og:image —
# it reads `page.image`. The 23 Jun launch failed because new posts had no per-post `image:`
# and this default emitted nothing. The REAL og:image fallback now lives in the `defaults:`
# block below (applied to every post). Per-post `image:` still overrides.
image: /images/banner-main-01-1600.jpg

permalink: pretty
future: true
logo: "https://s.gravatar.com/avatar/e93642b3913fe528117101c28451d28b?s=80"

# Pagination
paginate: 5
paginate_path: blog/page:num

# Defaults block
#   - Excludes pagination pages from sitemap (existing)
#   - Auto-applies layout: post and author: Peter Twigg to all _posts (added 3 June 2026)
#     This eliminates front-matter friction and prevents author/layout omissions.
#     The pre-commit hook still enforces description, tags, and internal links.
defaults:
  - scope:
      path: "blog/page*"
    values:
      sitemap: false
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Peter Twigg"
      image: "/images/banner-main-01-1600.jpg"   # og:image for EVERY post (jekyll-seo-tag reads page.image); per-post `image:` overrides. Added 23 Jun 2026 — the real fix for the Make.com og:image dependency that the top-level `image:` never provided.

# Header nav
navigation_header:
- title: Home
  url: /
- title: Posts
  url: /blog/ 
- title: School of Knowing
  url: /school-of-knowing/ 
- title: 7DMC
  url: /7dmc/
- title: Books
  url: /books/
- title: About
  url: /about/
- title: Contact
  url: /contact/
- title: Testimonials
  url: /testimonials/

# Footer nav
navigation_footer:
- title: Back to top
  url: "#top"

# Collections
collections:
  posts:
    title: Posts
    output: true
    description: Meditation articles on techniques, consciousness, spirituality and personal development by Peter Twigg.
    feature_text: 
    feature_image: "/images/banner-main-01-1600.jpg"

# Appears in sidebar. Set the urls then uncomment and comment out as desired
social_links: 
  Facebook: https://www.facebook.com/petertwiggmeditation
  YouTube: https://www.youtube.com/channel/UC8Ik2FYO2lu71QjNKxUW-qw
  Twitter: https://twitter.com/solon_1
  LinkedIn: https://www.linkedin.com/in/peter-twigg-991a8818b/
  Instagram: https://www.instagram.com/peter_twigg_meditation/

# Appear at the bottom of single blog posts, add as desired. The value can be 'true' or the desired button colour
sharing_links: 
  Twitter: "#0d94e7"
  Facebook: "#3B5998"
  Email: true
 
